services:
  - type: web
    name: mbeund-mi
    env: python
    pythonVersion: "3.11.9"
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput --settings=mbeund_mi_backend.settings.prod
    # ASGI (daphne) et non WSGI (gunicorn) : seul un serveur ASGI accepte les
    # WebSockets des alertes en temps réel (ws/alertes/). --proxy-headers :
    # Render est derrière un proxy (vraie IP client, schéma https).
    startCommand: daphne --bind 0.0.0.0 --port $PORT --proxy-headers mbeund_mi_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: "production"
      - key: USE_GIS
        value: "True"
      - key: DJANGO_SETTINGS_MODULE
        value: "mbeund_mi_backend.settings.prod"
