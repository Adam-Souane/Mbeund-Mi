# =============================================================================
# Mosquitto – Configuration broker MQTT pour capteurs IoT Mbeund-Mi
# =============================================================================

# Mode persistence : sauvegarde les messages sur disque
persistence true
persistence_location /mosquitto/data/

# Fichier de log
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Listener MQTT standard (port 1883)
listener 1883
# Autoriser les connexions anonymes en développement
# En production : passer allow_anonymous à false et configurer le mot de passe
allow_anonymous true

# Listener WebSocket (port 9001) – pour les clients web
listener 9001
protocol websockets
allow_anonymous true

# Taille maximale des messages (256 KB)
message_size_limit 262144

# Délai de connexion
connect_timeout 20
