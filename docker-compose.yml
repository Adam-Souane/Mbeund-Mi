version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mbeund_mi_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mbeund_mi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mbeund_mi_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization script
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql
      - ./seeds/seed_data.sql:/docker-entrypoint-initdb.d/20-seed.sql

  redis:
    image: redis:7-alpine
    container_name: mbeund_mi_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: mbeund_mi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mbeund_mi}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-mbeund_mi_password}
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
