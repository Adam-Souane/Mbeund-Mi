services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mbeund_mi_db
    restart: always
    environment:
      POSTGRES_DB: mbeund_mi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mbeund_mi_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: ./backend
    container_name: mbeund_mi_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    container_name: mbeund_mi_celery
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
