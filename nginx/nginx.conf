# =============================================================================
# Nginx – Configuration reverse proxy pour Mbeund-Mi
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format de log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # Upstream Django/Gunicorn
    # -------------------------------------------------------------------------
    upstream django {
        server web:8000;
    }

    # -------------------------------------------------------------------------
    # Serveur HTTP principal (port 80)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Fichiers statiques Django (collectstatic)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Fichiers médias (uploads)
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # API Django et Admin – proxy vers Gunicorn
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
            proxy_connect_timeout 90;

            # En-têtes CORS basiques (optionnel – à affiner)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Health check Nginx
        location /nginx-health {
            return 200 'Nginx OK\n';
            add_header Content-Type text/plain;
        }
    }
}
