# =============================================================================
# Nginx – Configuration PRODUCTION pour Mbeund-Mi
# Domaine : mbeundmi.sn | SSL via Let's Encrypt (Certbot)
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Upstream Django/Gunicorn
    # -------------------------------------------------------------------------
    upstream django {
        server web:8000;
    }

    # =========================================================================
    # Serveur HTTP (port 80) — Redirect vers HTTPS + Challenge ACME Certbot
    # =========================================================================
    server {
        listen 80;
        server_name mbeundmi.sn www.mbeundmi.sn;

        # Challenge Let's Encrypt (renouvellement Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirection permanente HTTP → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Serveur HTTPS (port 443) — Application principale
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name mbeundmi.sn www.mbeundmi.sn;

        # -----------------------------------------------------------------
        # Certificats SSL Let's Encrypt (générés par Certbot)
        # -----------------------------------------------------------------
        ssl_certificate     /etc/letsencrypt/live/mbeundmi.sn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mbeundmi.sn/privkey.pem;

        # -----------------------------------------------------------------
        # Configuration SSL renforcée (Mozilla Modern)
        # -----------------------------------------------------------------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # -----------------------------------------------------------------
        # En-têtes de sécurité
        # -----------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

        # -----------------------------------------------------------------
        # Fichiers statiques Django (collectstatic)
        # -----------------------------------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff";
        }

        # -----------------------------------------------------------------
        # Fichiers médias (uploads utilisateurs)
        # -----------------------------------------------------------------
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # -----------------------------------------------------------------
        # Proxy vers Django/Gunicorn — API et Admin
        # -----------------------------------------------------------------
        location / {
            proxy_pass         http://django;
            proxy_redirect     off;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $server_name;

            proxy_read_timeout    90;
            proxy_connect_timeout 90;
            proxy_send_timeout    90;

            # Buffer
            proxy_buffering    on;
            proxy_buffer_size  8k;
            proxy_buffers      8 8k;

            # CORS (à affiner selon les origines frontend réelles)
            add_header 'Access-Control-Allow-Origin'  'https://mbeundmi.sn' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  'https://mbeundmi.sn';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # -----------------------------------------------------------------
        # Health check Nginx
        # -----------------------------------------------------------------
        location /nginx-health {
            return 200 'Nginx OK\n';
            add_header Content-Type text/plain;
        }
    }
}
